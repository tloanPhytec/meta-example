[Unit]
Requires=weston-vnc-certificate.service
After=weston-vnc-certificate.service

[Service]
ExecStart=
ExecStart=@BINDIR@/weston --backend=vnc --renderer=pixman --width=1280 --height=800 --port=5901 --vnc-tls-cert=@SYSCONFDIR@/weston/vnc.crt --vnc-tls-key=@SYSCONFDIR@/weston/vnc.key --log=${XDG_RUNTIME_DIR}/weston.log --modules=systemd-notify.so
